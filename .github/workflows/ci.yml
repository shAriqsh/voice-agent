name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python and dependencies
        run: uv sync --locked

      - name: Typecheck with mypy
        run: uv run mypy src tests

      - name: Lint with ruff
        run: uv run ruff check src tests

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voice_agent
          POSTGRES_PASSWORD: voice_agent
          POSTGRES_DB: voice_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voice_agent -d voice_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      qdrant:
        image: qdrant/qdrant:v1.13.2
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python and dependencies
        run: uv sync --locked

      - name: Run test suite
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://voice_agent:voice_agent@localhost:5432/voice_agent
          TEST_REDIS_URL: redis://localhost:6379/0
          TEST_QDRANT_URL: http://localhost:6333
        run: uv run pytest
